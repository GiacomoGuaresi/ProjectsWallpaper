# Ogni ora fotografa la Foresta di Projects e pubblica le PNG su GitHub Pages.
# La passphrase dell'account condiviso è il secret FORESTA_PASSPHRASE
# (Settings → Secrets and variables → Actions → Secrets). Se la foto non riesce
# il deploy non parte, e su Pages restano le immagini dell'ora prima.
#
# Il giro orario lo fa partire pg_cron di Supabase con workflow_dispatch, tramite
# la funzione foresta-aggiorna (sql/foresta-aggiorna.sql): il cron di GitHub
# salta spesso ore intere. Lo stesso fanno, a richiesta, il comando
# projectswallpaper e il tocco sul widget.

name: Genera

on:
  schedule:
    # Solo di riserva, se Supabase non chiama. GitHub disattiva i cron dei repo
    # pubblici dopo 60 giorni senza commit; workflow_dispatch funziona comunque.
    - cron: '37 */3 * * *'
  push:
    branches: [main]
    # L'app Android non cambia le foto.
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un giro alla volta; quello in corso non si interrompe a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Installa Chromium
        run: npx playwright install --with-deps chromium
      # Il testo dell'overlay è in Avenir, che su Linux non c'è: Inter al suo posto, non DejaVu.
      - name: Installa il font Inter
        run: sudo apt-get install -y --no-install-recommends fonts-inter
      - name: Fotografa la Foresta
        run: npm run genera
        env:
          FORESTA_PASSPHRASE: ${{ secrets.FORESTA_PASSPHRASE }}
      # Se la foto non riesce: screenshot e registro della pagina, per capire perché.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosi
          path: diagnosi
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uscita

  deploy:
    needs: genera
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
